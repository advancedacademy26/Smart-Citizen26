name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  # Allows manually triggering a deploy from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fails loudly and clearly (instead of a confusing downstream error)
      # if package.json/next.config.ts/src aren't at the repo root — the
      # #1 cause of broken deployments, usually from a zip extraction that
      # created one extra nested folder before the files were pushed to
      # GitHub. See DEPLOYMENT.md for how to fix the repo structure.
      - name: Verify repository structure
        run: |
          missing=0
          for f in package.json next.config.ts src public; do
            if [ ! -e "$f" ]; then
              echo "::error::Required file/folder '$f' was not found at the repository root."
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "::error::Your repository's files are likely nested inside an extra folder (common after extracting a .zip and copying the wrong level into GitHub). Open DEPLOYMENT.md in this repo for the exact fix (either move all files up to the repo root, or in Vercel set Settings -> General -> Root Directory to that inner folder's name)."
            exit 1
          fi
          echo "Repository structure looks correct — package.json, next.config.ts, src/, and public/ are all at the repo root."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # Not using the built-in "cache: npm" option here on purpose — it
          # requires package-lock.json to exist to compute a cache key, and
          # would fail immediately if that file is missing (e.g. because it
          # wasn't included when the project was downloaded/zipped). The
          # install step below handles a missing lockfile gracefully instead.

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json found — using npm ci for a fast, reproducible install."
            npm ci
          else
            echo "::warning::package-lock.json was not found in this repository. Falling back to 'npm install', which still works but is slower and does not guarantee the exact same dependency versions every time. Run 'npm install' locally once and commit the generated package-lock.json to fix this permanently."
            npm install
          fi

      - name: Compute base path
        id: vars
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          # A repo literally named "<user>.github.io" is served at the domain
          # root, so it needs NO base path. Any other repo is served at
          # https://<user>.github.io/<repo-name>/ and needs the prefix.
          if [[ "$REPO_NAME" == *.github.io ]]; then
            echo "base_path=" >> "$GITHUB_OUTPUT"
            echo "site_url=https://${OWNER,,}.github.io/" >> "$GITHUB_OUTPUT"
          else
            echo "base_path=/$REPO_NAME" >> "$GITHUB_OUTPUT"
            echo "site_url=https://${OWNER,,}.github.io/$REPO_NAME/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static export
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.vars.outputs.base_path }}
        run: npm run build

      - name: Confirm the build actually produced output files
        run: |
          if [ ! -f "./out/index.html" ]; then
            echo "::error::The build finished but ./out/index.html is missing — something in the build step failed silently. Check the 'Build static export' step's log above."
            exit 1
          fi
          echo "✅ Build output verified: ./out/index.html exists."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Print the exact URL to open after this deploy finishes
        run: |
          echo "### 🚀 Your site will be live at:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**${{ steps.vars.outputs.site_url }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Make sure to type/open this EXACT address (including the trailing slash and matching upper/lower case) once the 'deploy' job below finishes." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
